<h2>

@if(editing){
Editar Empresa
}
@else {
Crear Empresa
}

</h2>

<form
[formGroup]="form"
(ngSubmit)="save()">

<label>
Usuario ID
</label>

<input
type="number"
formControlName="usuarioId">

<label>
Razón social
</label>

<input
type="text"
formControlName="razonSocial">

<label>
NIT
</label>

<input
type="text"
formControlName="nit">

<label>
Sector
</label>

<input
type="text"
formControlName="sector">

<label>
Dirección
</label>

<input
type="text"
formControlName="direccion">

<label>
Ciudad
</label>

<input
type="text"
formControlName="ciudad">

<label>
Teléfono
</label>

<input
type="text"
formControlName="telefono">

<label>
Correo contacto
</label>

<input
type="email"
formControlName="correoContacto">

<label>
Representante legal
</label>

<input
type="text"
formControlName="representanteLegal">

<label>

<input
type="checkbox"
formControlName="estado">

Activa

</label>

<button
type="submit">

@if(editing){
Actualizar
}
@else{
Guardar
}

</button>

<button
type="button"
(click)="cancel()">

Cancelar

</button>

</form>
