<h1>

{{ edit
? 'Editar FAQ'
: 'Nueva FAQ'
}}

</h1>

<form
[formGroup]="form"
(ngSubmit)="save()">

<label>

Pregunta

</label>

<input
formControlName="pregunta">

<br>

<label>

Respuesta

</label>

<textarea
formControlName="respuesta">

</textarea>

<br>

<label>

Categoría

</label>

<select
formControlName="categoria">

<option>
GENERAL
</option>

<option>
EMPRESA
</option>

<option>
ESTUDIANTE
</option>

<option>
PRACTICA
</option>

</select>

<br>

<button
type="submit">

Guardar

</button>

</form>
