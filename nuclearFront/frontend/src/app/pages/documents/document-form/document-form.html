<h1>

Nuevo documento

</h1>

<form
[formGroup]="form"
(ngSubmit)="save()">

<input
formControlName="estudianteId"
placeholder="ID estudiante">

<input
formControlName="empresaId"
placeholder="ID empresa">

<input
formControlName="convenioId"
placeholder="ID convenio">

<input
formControlName="nombre"
placeholder="Nombre">

<input
formControlName="tipoDocumento"
placeholder="Tipo documento">

<input
formControlName="urlArchivo"
placeholder="URL">

<input
type="datetime-local"
formControlName="fechaCarga">

<input
formControlName="estado"
placeholder="Estado">

<button
type="submit">

Guardar

</button>

</form>
