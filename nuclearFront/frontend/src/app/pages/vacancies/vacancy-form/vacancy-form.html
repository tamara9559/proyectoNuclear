<h2>

{{
editing
? 'Editar vacante'
: 'Crear vacante'
}}

</h2>

<form
[formGroup]="form"
(ngSubmit)="save()">

<input
type="number"
placeholder="Empresa ID"
formControlName="empresaId">

<input
type="text"
placeholder="Título"
formControlName="titulo">

<textarea
placeholder="Descripción"
formControlName="descripcion">
</textarea>

<input
type="text"
placeholder="Perfil requerido"
formControlName="perfilRequerido">

<input
type="text"
placeholder="Habilidades"
formControlName="habilidadesRequeridas">

<label>
Competencias requeridas
</label>

<input
type="text"
formControlName="competenciasRequeridas"
/>

<input
type="text"
placeholder="Carrera requerida"
formControlName="carreraRequerida">

<input
type="text"
placeholder="Tipo vacante"
formControlName="tipoVacante">

<input
type="text"
placeholder="Modalidad"
formControlName="modalidad">

<input
type="text"
placeholder="Ciudad"
formControlName="ciudad">

<input
type="number"
placeholder="Remuneración"
formControlName="remuneracion">

<input
type="number"
placeholder="Cupos"
formControlName="cupos">

<input
type="text"
placeholder="Estado"
formControlName="estado">

<input
type="date"
formControlName="fechaCierre">

<div>

<button
type="submit">

@if(editing){
Actualizar
}
@else{
Guardar
}

</button>

<button
type="button"
(click)="cancel()">

Cancelar

</button>

</div>

</form>
