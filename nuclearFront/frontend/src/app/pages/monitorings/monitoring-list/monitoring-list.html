<h1>

Seguimientos

</h1>

<input
type="number"
[(ngModel)]="practiceId"
placeholder="Id práctica">

<button
(click)="search()">

Buscar

</button>

<button
(click)="newMonitoring()">

Nuevo

</button>

<hr>

<table>

<thead>

<tr>

<th>

ID

</th>

<th>

Tipo

</th>

<th>

Descripción

</th>

<th>

Fecha

</th>

</tr>

</thead>

<tbody>

<tr
*ngFor="
let m
of monitorings
">

<td>

{{ m.id }}

</td>

<td>

{{ m.tipoSeguimiento }}

</td>

<td>

{{ m.descripcion }}

</td>

<td>

{{ m.fechaRegistro }}

</td>

</tr>

</tbody>

</table>
