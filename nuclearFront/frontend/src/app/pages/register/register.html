<form
[formGroup]="form"
(ngSubmit)="register()"
>

<h1>
Registro
</h1>

<input
placeholder="Nombre"
formControlName="nombres"
/>

<br>

<input
placeholder="Apellido"
formControlName="apellidos"
/>

<br>

<input
type="email"
placeholder="Correo"
formControlName="correo"
/>

<br>

<input
type="password"
placeholder="Contraseña"
formControlName="password"
/>

<br>

<input
placeholder="Teléfono"
formControlName="telefono"
/>

<br>

<select formControlName="rol">

<option value="">
Seleccione rol
</option>

<option value="ESTUDIANTE">
Estudiante
</option>

<option value="EGRESADO">
Egresado
</option>

<option value="EMPRESA">
Empresa
</option>

<option value="DOCENTE">
Docente
</option>

<option value="COORDINADOR">
Coordinador
</option>

<option value="ADMIN">
Administrador
</option>

</select>

<br>

<button
type="submit"
>

Registrarse

</button>

</form>
