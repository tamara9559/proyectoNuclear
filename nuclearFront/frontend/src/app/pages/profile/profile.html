<h1>Mi perfil</h1>

<div *ngIf="loading">

<p>
Cargando perfil...
</p>

</div>

<div
*ngIf="!loading && user"
class="card"
>

<p>
Nombre:
{{ user.nombres }}
</p>

<p>
Apellido:
{{ user.apellidos }}
</p>

<p>
Correo:
{{ user.correo }}
</p>

<p>
Teléfono:
{{ user.telefono }}
</p>

<p>
Rol:
{{ user.rol }}
</p>

<p>
Estado:
{{ user.estado }}
</p>

<button
(click)="edit()"
>

Editar perfil

</button>

</div>
