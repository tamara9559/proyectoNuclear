<h1>

Vacantes

</h1>

<button
(click)="goToCreate()">

Crear vacante

</button>

<button
(click)="goBack()">

Volver

</button>

<table>

<thead>

<tr>

<th>ID</th>

<th>Título</th>

<th>Empresa</th>

<th>Ciudad</th>

<th>Carrera</th>

<th>Modalidad</th>

<th>Remuneración</th>

<th>Cupos</th>

<th>Estado</th>

<th>Acciones</th>

</tr>

</thead>

<tbody>

<tr
*ngFor="
let vacancy
of vacancies
">

<td>

{{ vacancy.id }}

</td>

<td>

{{ vacancy.titulo }}

</td>

<td>

{{ vacancy.empresaId }}

</td>

<td>

{{ vacancy.ciudad }}

</td>

<td>

{{ vacancy.carreraRequerida }}

</td>

<td>

{{ vacancy.modalidad }}

</td>

<td>

{{ vacancy.remuneracion }}

</td>

<td>

{{ vacancy.cupos }}

</td>

<td>

{{ vacancy.estado }}

</td>

<td>

<button
(click)="
goToEdit(
vacancy.id!
)
">

Editar

</button>

</td>

</tr>

</tbody>

</table>
