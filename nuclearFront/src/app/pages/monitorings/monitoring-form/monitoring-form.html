<h1>

Nuevo seguimiento

</h1>

<form
[formGroup]="form"
(ngSubmit)="save()">

<input
type="number"
formControlName="practicaId"
placeholder="Práctica">

<br>

<input
type="number"
formControlName="coordinadorId"
placeholder="Coordinador">

<br>

<select
formControlName="tipoSeguimiento">

<option>

VISITA

</option>

<option>

OBSERVACION

</option>

<option>

REUNION

</option>

<option>

LLAMADA

</option>

</select>

<br>

<textarea
formControlName="descripcion">

</textarea>

<br>

<button
type="submit">

Guardar

</button>

</form>
