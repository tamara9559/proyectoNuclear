<h1>

{{ editing
? 'Editar práctica'
: 'Crear práctica'
}}

</h1>

<form
[formGroup]="form"
(ngSubmit)="save()"
>

<input
type="number"
placeholder="Estudiante ID"
formControlName="estudianteId"
/>

<input
type="number"
placeholder="Empresa ID"
formControlName="empresaId"
/>

<input
type="number"
placeholder="Vacante ID"
formControlName="vacanteId"
/>

<input
type="number"
placeholder="Convenio ID"
formControlName="convenioId"
/>

<input
type="text"
placeholder="Ciudad"
formControlName="ciudad"
/>

<input
type="text"
placeholder="Tutor"
formControlName="tutorEmpresarial"
/>

<input
type="email"
placeholder="Correo tutor"
formControlName="correoTutor"
/>

<input
type="text"
placeholder="Contrato"
formControlName="tipoContrato"
/>

<input
type="date"
formControlName="fechaInicio"
/>

<input
type="date"
formControlName="fechaFin"
/>

<input
type="number"
placeholder="Duración"
formControlName="duracionSemanas"
/>

<input
type="text"
placeholder="Estado"
formControlName="estado"
/>

<label>

<input
type="checkbox"
formControlName="requiereMovilidad"
/>

Movilidad

</label>

<textarea
formControlName="observaciones"
placeholder="Observaciones"
>
</textarea>

<button
type="submit"
>

Guardar

</button>

<button
type="button"
(click)="cancel()"
>

Cancelar

</button>

</form>
