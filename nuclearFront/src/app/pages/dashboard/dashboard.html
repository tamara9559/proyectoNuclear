<h1>

Panel principal

</h1>

<p>

Selecciona un módulo

</p>

<div class="cards">

@for (
module of visibleModules();
track module.route
) {

<div
class="card"
(click)="goTo(module.route)"
>

<h2>

{{ module.title }}

</h2>

<p>

{{ module.description }}

</p>

<button>

Entrar

</button>

</div>

}

</div>
